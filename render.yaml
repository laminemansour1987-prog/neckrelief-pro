services:
  - type: web
    name: plomberie-ia-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: WORK_START_HOUR
        value: "8"
      - key: WORK_END_HOUR
        value: "18"
      - key: SLOT_HOURS
        value: "2"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: URGENT_BUFFER_MINUTES
        value: "45"
      - key: NORMAL_BUFFER_HOURS
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
